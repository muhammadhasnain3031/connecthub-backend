name: ConnectHub Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend Lint & Unit/Integration Tests
    runs-on: ubuntu-latest

    # ⚡ FIX: GitHub cloud runner par temporary MongoDB database start karein
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Backend/package-lock.json'

      - name: Install Backend Dependencies
        run: |
          cd Backend
          npm ci

      - name: Run ESLint Quality Audit
        run: |
          cd Backend
          npm run lint

      - name: Execute Jest & Supertest Suite
        env:
          # ⚡ FIX: Mapping database URI to the cloud container port
          MONGO_URI: "mongodb://localhost:27017/connecthub_test"
          JWT_SECRET: "ci_pipeline_fallback_dummy_secret_key_string"
          NODE_ENV: test
          GOOGLE_CLIENT_ID: "dummy_client_id_for_ci_pipeline_://googleusercontent.com"
          GOOGLE_CLIENT_SECRET: "dummy_client_secret_for_ci_pipeline_verification"
          GOOGLE_CALLBACK_URL: "http://localhost:5000/api/auth/google/callback"
          STRIPE_SECRET_KEY: "sk_test_dummy_stripe_secret_key_string_for_automated_ci_pipeline"
        run: |
          cd Backend
          node --experimental-vm-modules node_modules/jest/bin/jest.js routes/auth.test.js --forceExit --detectOpenHandles
